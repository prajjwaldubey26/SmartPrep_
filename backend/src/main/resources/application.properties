spring.application.name=smartprep-backend
server.port=8080
server.max-http-request-header-size=64KB

# Default: H2 in-memory so the app runs without MySQL installed.
# Switch to MySQL by setting smartprep.db=mysql and filling credentials below.
smartprep.db=h2

spring.datasource.url=jdbc:h2:mem:smartprep;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# MySQL profile overrides (activate with --spring.profiles.active=mysql)
# spring.datasource.url=jdbc:mysql://localhost:3306/smartprep?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

smartprep.jwt.secret=${JWT_SECRET:SmartPrepSuperSecretKeyForJwtSigningMustBeLongEnough123456}
smartprep.jwt.expiration-ms=86400000

# Live AI via NVIDIA NIM (OpenAI-compatible). Falls back to local coach if disabled/missing key.
# Render env examples:
#   NVIDIA_API_KEY=nvapi-...
#   SMARTPREP_AI_ENABLED=true
#   SMARTPREP_AI_BASE_URL=https://integrate.api.nvidia.com/v1
#   SMARTPREP_AI_MODEL=meta/llama-3.1-70b-instruct
smartprep.ai.enabled=${SMARTPREP_AI_ENABLED:true}
smartprep.ai.api-key=${SMARTPREP_AI_API_KEY:}
smartprep.ai.nvidia-api-key=${NVIDIA_API_KEY:}
smartprep.ai.openai-api-key=${OPENAI_API_KEY:}
smartprep.ai.base-url=${SMARTPREP_AI_BASE_URL:https://integrate.api.nvidia.com/v1}
smartprep.ai.model=${SMARTPREP_AI_MODEL:meta/llama-3.1-70b-instruct}
smartprep.ai.max-tokens=${SMARTPREP_AI_MAX_TOKENS:1024}
