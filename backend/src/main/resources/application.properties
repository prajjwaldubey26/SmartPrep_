spring.application.name=smartprep-backend
server.port=8080
server.max-http-request-header-size=64KB

# Local default: H2 in-memory (data resets when the process stops).
# Production persistence: set SPRING_PROFILES_ACTIVE=postgres (or mysql)
# and SPRING_DATASOURCE_URL / USERNAME / PASSWORD.
smartprep.db=h2

spring.datasource.url=jdbc:h2:mem:smartprep;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

smartprep.jwt.secret=${JWT_SECRET:SmartPrepSuperSecretKeyForJwtSigningMustBeLongEnough123456}
smartprep.jwt.expiration-ms=86400000

# Live AI via NVIDIA NIM (OpenAI-compatible). Falls back to local coach if disabled/missing key.
# Render env examples:
#   NVIDIA_API_KEY=nvapi-...
#   SMARTPREP_AI_ENABLED=true
#   SMARTPREP_AI_BASE_URL=https://integrate.api.nvidia.com/v1
#   SMARTPREP_AI_MODEL=openai/gpt-oss-20b
#   SPRING_PROFILES_ACTIVE=postgres
#   SPRING_DATASOURCE_URL=jdbc:postgresql://db.<ref>.supabase.co:5432/postgres?sslmode=require
#   SPRING_DATASOURCE_USERNAME=postgres
#   SPRING_DATASOURCE_PASSWORD=<database password>
smartprep.ai.enabled=${SMARTPREP_AI_ENABLED:true}
smartprep.ai.api-key=${SMARTPREP_AI_API_KEY:}
smartprep.ai.nvidia-api-key=${NVIDIA_API_KEY:}
smartprep.ai.openai-api-key=${OPENAI_API_KEY:}
smartprep.ai.base-url=${SMARTPREP_AI_BASE_URL:https://integrate.api.nvidia.com/v1}
smartprep.ai.model=${SMARTPREP_AI_MODEL:meta/llama-3.1-70b-instruct}
smartprep.ai.max-tokens=${SMARTPREP_AI_MAX_TOKENS:1024}

# Optional premium TTS (best human quality). Falls back to browser neural voices.
# Priority: ElevenLabs (Sarah) -> OpenAI TTS (nova) -> browser.
#   ELEVENLABS_API_KEY=...
#   ELEVENLABS_VOICE_ID=EXAVITQu4vr4xnSDxMaL
#   OPENAI_API_KEY=...   (also used for TTS if set)
smartprep.tts.elevenlabs-api-key=${ELEVENLABS_API_KEY:}
smartprep.tts.elevenlabs-voice-id=${ELEVENLABS_VOICE_ID:EXAVITQu4vr4xnSDxMaL}
smartprep.tts.openai-api-key=${SMARTPREP_TTS_OPENAI_API_KEY:}
smartprep.tts.openai-voice=${SMARTPREP_TTS_VOICE:nova}
smartprep.tts.openai-model=${SMARTPREP_TTS_MODEL:gpt-4o-mini-tts}
