<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 148" fill="none" role="img" aria-label="SMARTPREP">
  <!-- Theme-matched coach mark: ice white + cyan accent on transparent -->
  <defs>
    <linearGradient id="tieGrad" x1="64" y1="88" x2="64" y2="136" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB4A2"/>
      <stop offset="0.45" stop-color="#7EF0D8"/>
      <stop offset="1" stop-color="#6AD7C4"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="20" y1="12" x2="108" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D7DEE8"/>
    </linearGradient>
  </defs>

  <!-- Inverted rounded triangle frame -->
  <path
    d="M64 118 L22 34 C19.5 28.5 23.5 22 30 22 H98 C104.5 22 108.5 28.5 106 34 L64 118 Z"
    stroke="url(#frameGrad)"
    stroke-width="9"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Head -->
  <circle cx="64" cy="48" r="14" fill="#F4F6F8"/>

  <!-- Collar left -->
  <path d="M40 92 L58 112 L52 124 L28 100 Z" fill="#EEF2F7"/>
  <!-- Collar right -->
  <path d="M88 92 L70 112 L76 124 L100 100 Z" fill="#E4EAF2"/>

  <!-- Tie -->
  <path d="M64 90 L70 98 L64 132 L58 98 Z" fill="url(#tieGrad)"/>
  <path d="M58 90 H70 L67 96 H61 Z" fill="#FFB4A2"/>

  <!-- Cursor -->
  <path d="M96 18 L110 46 L102 44 L108 58 L102 60 L96 46 L88 52 Z" fill="#7EF0D8"/>
  <!-- Click rays -->
  <path d="M112 14 L118 10" stroke="#7EF0D8" stroke-width="3" stroke-linecap="round"/>
  <path d="M116 22 L124 22" stroke="#7EF0D8" stroke-width="3" stroke-linecap="round"/>
  <path d="M112 30 L118 34" stroke="#7EF0D8" stroke-width="3" stroke-linecap="round"/>
</svg>
