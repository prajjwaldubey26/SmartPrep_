<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coach Chat — SMARTPREP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@200;300;400;500;600&family=Syne:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="studio-body">
    <div class="studio-shell">
      <div class="studio-stage chat-stage">
        <div class="stage-grid" aria-hidden="true"></div>
        <div class="stage-scan" aria-hidden="true"></div>
        <canvas id="signalCanvas" class="signal-canvas" aria-hidden="true"></canvas>
        <div class="ghost-word ghost-word-chat" aria-hidden="true">COACH</div>

        <header class="studio-nav-wrap">
          <nav class="glass-dock" aria-label="Primary">
            <a class="dock-tile" href="index.html" title="Home" aria-label="Home">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M7 4L3 12L7 20M17 4L21 12L17 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
              </svg>
            </a>
            <a class="dock-tile" href="dashboard.html" title="Dashboard" aria-label="Dashboard">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8" />
                <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8" />
                <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8" />
                <rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8" />
              </svg>
            </a>
            <a class="dock-tile" href="interview.html" title="Interview" aria-label="Interview">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                <rect x="8" y="13" width="8" height="5" rx="4" stroke="currentColor" stroke-width="1.8" />
                <path d="M5 10a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </a>
            <a class="dock-tile active" href="chatbot.html" title="Coach Chat" aria-label="Coach Chat">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 6.5A2.5 2.5 0 0 1 7.5 4h9A2.5 2.5 0 0 1 19 6.5v7A2.5 2.5 0 0 1 16.5 16H10l-4 3v-3H7.5A2.5 2.5 0 0 1 5 13.5v-7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
              </svg>
            </a>
            <a class="dock-tile" href="login.html" title="Account" aria-label="Account">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8" />
                <path d="M5 19c1.8-3.2 4.2-4.8 7-4.8S17.2 15.8 19 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </a>
          </nav>
        </header>

        <main class="chat-layout">
          <aside class="liquid-plate chat-side fade-up">
            <p class="eyebrow">Interview coach</p>
            <h1 class="chat-title">Ask. Practice. Refine.</h1>
            <p class="chat-side-copy">
              Your SMARTPREP coach helps with frameworks, answer structure, role prep, and weak-area drills — in the same studio language as your mocks.
            </p>
            <div class="chat-suggestions">
              <button type="button" class="suggest-chip" data-prompt="How should I structure a behavioral answer using STAR?">STAR framework</button>
              <button type="button" class="suggest-chip" data-prompt="Give me a system design checklist for a URL shortener interview.">System design checklist</button>
              <button type="button" class="suggest-chip" data-prompt="What are common mistakes in coding interviews and how do I avoid them?">Coding pitfalls</button>
              <button type="button" class="suggest-chip" data-prompt="Help me prepare for an HR round for a software engineer role.">HR prep</button>
            </div>
            <a class="cta-rim chat-side-cta" href="interview.html">
              <span class="cta-icon" aria-hidden="true"><span></span><span></span><span></span></span>
              Enter mock interview
            </a>
          </aside>

          <section class="liquid-plate chat-panel fade-up-delay">
            <div class="chat-panel-head">
              <div class="chat-presence">
                <span class="status-dot"></span>
                Coach online
              </div>
              <button type="button" class="pill pill-light chat-clear" id="clearChatBtn">
                <span class="pill-dot">×</span>
                Clear
              </button>
            </div>

            <div class="chat-thread" id="chatThread" aria-live="polite"></div>

            <form class="chat-composer" id="chatForm">
              <textarea
                id="chatInput"
                rows="1"
                placeholder="Ask about interviews, frameworks, or feedback…"
                required
              ></textarea>
              <button class="cta-rim chat-send" type="submit" id="sendBtn">
                Send
              </button>
            </form>
            <p class="error-text chat-error hidden" id="chatError"></p>
          </section>
        </main>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui-3d.js"></script>
    <script src="js/chatbot.js"></script>
  </body>
</html>
