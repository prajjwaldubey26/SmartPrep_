<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — SMARTPREP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="panel">
        <nav class="nav">
          <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M7 4L3 12L7 20" stroke="#111" stroke-width="2.4" stroke-linecap="round" />
                <path d="M17 4L21 12L17 20" stroke="#111" stroke-width="2.4" stroke-linecap="round" />
              </svg>
            </span>
            SMARTPREP
          </a>
          <ul class="nav-links">
            <li><a class="active" href="dashboard.html">Dashboard</a></li>
            <li><a href="interview.html">Interview</a></li>
            <li><a href="chatbot.html">Coach</a></li>
            <li><a href="results.html">Results</a></li>
          </ul>
          <button class="pill pill-light" type="button" id="logoutBtn">
            <span class="pill-dot">×</span>
            Logout
          </button>
        </nav>

        <main class="app-main">
          <div class="flex flex-wrap items-end justify-between gap-4">
            <div>
              <h1 class="page-title" id="welcomeTitle">Your practice studio</h1>
              <p class="page-sub">Track progress, spot weak areas, and start the next adaptive mock.</p>
            </div>
            <a class="pill" href="interview.html">
              <span class="pill-dot">+</span>
              Begin Interview
            </a>
          </div>

          <div class="grid-3">
            <div class="stat">
              <div class="stat-label">Sessions</div>
              <div class="stat-value" id="statSessions">0</div>
            </div>
            <div class="stat">
              <div class="stat-label">Avg score</div>
              <div class="stat-value" id="statScore">—</div>
            </div>
            <div class="stat">
              <div class="stat-label">Focus area</div>
              <div class="stat-value" id="statFocus" style="font-size: 1.35rem">—</div>
            </div>
          </div>

          <section class="section">
            <div class="section-head">
              <h2>Recent sessions</h2>
            </div>
            <div class="list" id="historyList">
              <div class="list-item">
                <div>
                  <h3>No sessions yet</h3>
                  <p>Start your first mock interview to see history here.</p>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
