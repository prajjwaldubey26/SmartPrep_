<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — SMARTPREP</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="panel">
        <nav class="nav">
          <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true"><img src="assets/logo-mark-light.svg" alt="" width="28" height="32" /></span>
            SMARTPREP
          </a>
          <a class="pill pill-light" href="register.html">
            <span class="pill-dot">+</span>
            Create account
          </a>
        </nav>

        <main class="app-main">
          <h1 class="page-title fade-up">Welcome back</h1>
          <p class="page-sub fade-up">Sign in to continue your mock interview practice.</p>

          <form class="form-card fade-up-delay" id="loginForm">
            <div class="form-group">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required placeholder="you@example.com" />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" required placeholder="••••••••" />
            </div>
            <div class="form-actions">
              <button class="pill" type="submit">
                <span class="pill-dot">→</span>
                Sign in
              </button>
              <span class="muted-link">New here? <a href="register.html">Register</a></span>
            </div>
            <p class="error-text hidden" id="errorBox"></p>
          </form>
        </main>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorBox = document.getElementById("errorBox");
        errorBox.classList.add("hidden");
        try {
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          await Auth.login(email, password);
          window.location.href = "dashboard.html";
        } catch (err) {
          errorBox.textContent = err.message || "Login failed";
          errorBox.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
