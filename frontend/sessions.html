<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Past Sessions — SMARTPREP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="panel">
        <nav class="nav">
          <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M7 4L3 12L7 20" stroke="#111" stroke-width="2.4" stroke-linecap="round" />
                <path d="M17 4L21 12L17 20" stroke="#111" stroke-width="2.4" stroke-linecap="round" />
              </svg>
            </span>
            SMARTPREP
          </a>
          <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="interview.html">Interview</a></li>
            <li><a class="active" href="sessions.html">Sessions</a></li>
            <li><a href="chatbot.html">Coach</a></li>
            <li><a href="results.html">Results</a></li>
          </ul>
          <a class="pill" href="interview.html">
            <span class="pill-dot">+</span>
            New mock
          </a>
        </nav>

        <main class="app-main">
          <h1 class="page-title">Past sessions</h1>
          <p class="page-sub" id="sessionsSub">
            Click any session to open its full report — questions, your answers, and coaching.
          </p>

          <div class="grid-3" style="margin-bottom: 22px">
            <div class="stat">
              <div class="stat-label">Total sessions</div>
              <div class="stat-value" id="sessionsTotal">0</div>
            </div>
            <div class="stat">
              <div class="stat-label">Completed</div>
              <div class="stat-value" id="sessionsCompleted">0</div>
            </div>
            <div class="stat">
              <div class="stat-label">Avg score</div>
              <div class="stat-value" id="sessionsAvg">—</div>
            </div>
          </div>

          <section class="section">
            <div class="section-head">
              <h2>All history</h2>
            </div>
            <div class="list" id="sessionsList">
              <div class="list-item">
                <div>
                  <h3>Loading sessions…</h3>
                  <p>Fetching your interview history.</p>
                </div>
              </div>
            </div>
            <p class="error-text hidden" id="sessionsError"></p>
          </section>
        </main>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sessions.js"></script>
  </body>
</html>
