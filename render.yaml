services:
  - type: web
    name: smartprep-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://db.pyxouvrwdejxwwogmgqk.supabase.co:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SMARTPREP_AI_ENABLED
        value: "true"
      - key: SMARTPREP_AI_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: SMARTPREP_AI_MODEL
        value: openai/gpt-oss-20b
      - key: NVIDIA_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: EXAVITQu4vr4xnSDxMaL
      - key: JWT_SECRET
        generateValue: true
