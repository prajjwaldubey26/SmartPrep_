services:
  - type: web
    name: smartprep-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SMARTPREP_AI_ENABLED
        value: "true"
      - key: SMARTPREP_AI_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: SMARTPREP_AI_MODEL
        value: meta/llama-3.1-70b-instruct
      - key: NVIDIA_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
